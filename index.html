<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disponibilités de l’équipe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#faf6f0;--surface:#fff;--text:#1b1717;--muted:#6f6660;--line:#ebe1d6;--brand:#d4151c;--on-brand:#fff;--accent:#f5b014;
--ok:#1a8f4c;--ok-bg:#dcf5e6;--ok-t:#126b38;--run:#f5b014;--run-bg:#fff0c7;--run-t:#855200;
--pause:#7b8799;--pause-bg:#e9edf3;--pause-t:#475569;--off:#d4151c;--off-bg:#fde4e4;--off-t:#b01016;
--shadow:0 1px 2px rgba(27,23,23,.05),0 8px 22px rgba(27,23,23,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151213;--surface:#211d1f;--text:#f6f0ea;--muted:#b0a69d;--line:#3a3335;--brand:#ef4651;--on-brand:#fff;--accent:#f7bd3a;
--ok:#4fd18e;--ok-bg:#12382a;--ok-t:#6fe0a6;--run:#f7bd3a;--run-bg:#403000;--run-t:#f7c95a;
--pause:#8f9bb0;--pause-bg:#2a3040;--pause-t:#b4bfd0;--off:#ef4651;--off-bg:#451318;--off-t:#ff8a92;
--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151213;--surface:#211d1f;--text:#f6f0ea;--muted:#b0a69d;--line:#3a3335;--brand:#ef4651;--on-brand:#fff;--accent:#f7bd3a;
--ok:#4fd18e;--ok-bg:#12382a;--ok-t:#6fe0a6;--run:#f7bd3a;--run-bg:#403000;--run-t:#f7c95a;
--pause:#8f9bb0;--pause-bg:#2a3040;--pause-t:#b4bfd0;--off:#ef4651;--off-bg:#451318;--off-t:#ff8a92;
--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.brandbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}.brandbar .sub{margin:0}.logobox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;flex:none;display:flex}.logobox img{display:block;height:44px;width:auto;max-width:100%}
@media (max-width:480px){.brandbar{flex-direction:column;align-items:flex-start;gap:8px}}
[hidden]{display:none!important}
.brandbar #logout{margin-left:auto}
.anon .hero,.anon .tabs,.anon #v-equipes,.anon #v-equipe,.anon #v-plan{display:none}
#auth{max-width:520px;margin:0 auto}
#auth .tabs{margin-top:0;display:flex}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:0 0 12px}
.chk input{width:auto;margin:0;display:inline-block}
.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.teams{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tcard header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcard h2{margin:0}
.tcount{font-weight:800;color:var(--ok-t);font-size:14px;white-space:nowrap}
.tcard .bar{height:8px;margin:10px 0}
.members{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.members li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.members .meta{display:block}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:800;margin:0 0 10px}
.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.hero,.mine{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big b{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em}
.big span{font-size:17px;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line);margin:14px 0 10px}
.bar i{display:block;height:100%;transition:width .35s}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--text);background:var(--surface);box-shadow:inset 0 0 0 1px var(--text)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.c-ok{--c:var(--ok);--cb:var(--ok-bg);--ct:var(--ok-t)}.c-run{--c:var(--run);--cb:var(--run-bg);--ct:var(--run-t)}.c-pause{--c:var(--pause);--cb:var(--pause-bg);--ct:var(--pause-t)}.c-off{--c:var(--off);--cb:var(--off-bg);--ct:var(--off-t)}
.dot,.bar i{background:var(--c)}
.mine{border-left:5px solid var(--brand)}
.stbig{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stbig button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 8px;font-weight:800}
.stbig button[aria-pressed="true"]{background:var(--cb);color:var(--ct,var(--c));border-color:var(--c)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-weight:700;font-size:13px}
label input,label select{display:block;width:100%;margin-top:4px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.mplan{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.mplan div{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.mplan .today{color:var(--brand)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--brand)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.me{box-shadow:0 0 0 2px var(--brand)}
.row{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.nm{font-weight:800;margin:0}
.meta{margin:0;color:var(--muted);font-size:13px}
.note{margin:0;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px}
.grow{flex:1;min-width:0}
.pill{background:var(--cb);color:var(--ct,var(--c));border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 2px;font-size:12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--cb);color:var(--ct,var(--c));border-color:var(--c)}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.foot a{color:inherit;font-weight:700}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:12px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted)}
th.today{color:var(--brand)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:140px}
td.today{background:color-mix(in srgb,var(--brand) 7%,transparent)}
.cell{border:0;border-radius:8px;width:100%;min-width:52px;padding:7px 0;font-weight:800;font-size:12px;background:var(--cb);color:var(--ct,var(--c))}
span.cell{display:block}
tfoot td{font-weight:800;border-bottom:0}
.hint{color:var(--muted);font-size:13px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;background:var(--run-bg);color:var(--run-t)}
.banner.err{background:var(--bg);color:var(--brand);border:1px solid var(--brand)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.brandbar{position:relative;overflow:hidden;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,#d4151c 0%,#a30e14 100%);color:#fff;box-shadow:var(--shadow)}
.brandbar>*{position:relative;z-index:1}
.brandbar::before,.brandbar::after{content:"";position:absolute;border-radius:60% 40% 55% 45%;z-index:0}
.brandbar::before{width:120px;height:64px;right:-18px;top:-14px;background:#f5b014;transform:rotate(-38deg)}
.brandbar::after{width:96px;height:52px;right:72px;bottom:-28px;background:rgba(255,255,255,.14);transform:rotate(24deg)}
.brandbar h1{color:#fff;font-size:24px}
.brandbar .sub{color:rgba(255,255,255,.88)}
.logobox{border:0;border-radius:14px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.brandbar .btn{background:#fff;border-color:#fff;color:#1b1717}
.hero,.mine,.tcard,.card{box-shadow:var(--shadow);border-radius:16px}
.hero{border-top:4px solid var(--accent)}
.big b{color:var(--brand)}
.mine{border-left-color:var(--accent)}
.tcard{border-top:4px solid var(--accent)}
.btn.primary:hover{filter:brightness(.92)}
.chip{box-shadow:0 1px 2px rgba(27,23,23,.06)}
.card,.tcard{transition:transform .15s,box-shadow .15s}
.card:hover,.tcard:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.card,.tcard{transition:none}.card:hover,.tcard:hover{transform:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={dispo:{l:"Disponible",s:"Dispo",c:"ok"},tournee:{l:"En tournée",s:"Tournée",c:"run"},pause:{l:"En pause",s:"Pause",c:"pause"},absent:{l:"Absent",s:"Absent",c:"off"}};
const ROLES=["Livreur","Dispatcheur","Magasinier","Superviseur","Administratif"];
const ZONES=["Cocody","Yopougon","Marcory","Plateau","Abobo","Koumassi"];
const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const PL={T:{l:"Travail",c:"ok"},R:{l:"Repos",c:"pause"},C:{l:"Congé",c:"run"}};
const TODAY=(new Date().getDay()+6)%7;
const WEEK="TTTTTTR".split("");
let db=null,user=null,uid=null,isOwner=false,defName="",team=[],loaded=false,editProfile=false,mineSig="";
let F={q:"",role:"",zone:"",status:""};
const queue={};

function enqueue(id,fn){queue[id]=(queue[id]||Promise.resolve()).then(fn).then(()=>{$("#err").hidden=true;return loadTeam().catch(()=>{})},e=>{
  $("#err").textContent=(e&&e.code==="invalid_argument")?"Action non autorisée. Reconnectez-vous ou contactez l’administrateur.":"Enregistrement impossible pour le moment. Réessayez.";$("#err").hidden=false})}
const ref=id=>db.doc("staff/"+id);
const me=()=>team.find(e=>e.id===uid);
const canAct=e=>isOwner||e.id===uid;
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));if(m<1)return"à l’instant";if(m<60)return"depuis "+m+" min";const h=Math.floor(m/60);return h<24?"depuis "+h+" h":"depuis "+Math.floor(h/24)+" j"}
function hue(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%360;return h}
const AVC=[["#d4151c","#fff"],["#f5b014","#1b1717"],["#1b1717","#fff"],["#a8650a","#fff"]];function avs(n){const a=AVC[hue(n)%4];return"background:"+a[0]+";color:"+a[1]}
function ini(n){return String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")}
function opts(list,first,sel){return(first?'<option value="">'+first+'</option>':"")+list.map(x=>'<option'+(x===sel?" selected":"")+'>'+esc(x)+'</option>').join("")}

function renderHero(){
  const n=team.length,c={};Object.keys(ST).forEach(k=>c[k]=team.filter(e=>e.status===k).length);
  $("#nDispo").textContent=c.dispo;
  $("#nTxt").textContent=n?"disponibles maintenant sur "+n+" employé"+(n>1?"s":""):"Personne n’a encore déclaré sa disponibilité";
  $("#bar").innerHTML=Object.keys(ST).map(k=>'<i class="c-'+ST[k].c+'" style="width:'+(n?c[k]/n*100:0)+'%"></i>').join("");
  $("#legend").innerHTML=Object.keys(ST).map(k=>'<button class="chip c-'+ST[k].c+'" data-a="kpi" data-s="'+k+'" aria-pressed="'+(F.status===k)+'"><span class="dot"></span>'+ST[k].l+" "+c[k]+'</button>').join("");
}
function renderMine(force){
  const box=$("#mine");
  if(!db||!uid||!loaded){box.hidden=true;return}
  const d=me();const sig=JSON.stringify([d,editProfile]);
  if(!force&&sig===mineSig)return;mineSig=sig;box.hidden=false;
  if(!d||editProfile){
    box.innerHTML='<h2>'+(d?"Modifier mon profil":"Rejoindre l’équipe")+'</h2><p class="sub">Renseignez qui vous êtes pour que l’équipe voie votre disponibilité.</p>'+
    '<div class="fields"><label>Nom complet<input id="s-name" maxlength="60" autocomplete="name" value="'+esc(d?d.name:defName)+'"></label>'+
    '<label>Fonction<select id="s-role">'+opts(ROLES,"",d&&d.role)+'</select></label>'+
    '<label>Zone<select id="s-zone">'+opts(ZONES,"",d&&d.zone)+'</select></label>'+'<label>Équipe<input id="s-team" list="teamlist" maxlength="40" value="'+esc(d?d.team:"")+'"></label>'+
    '<label>Téléphone<input id="s-phone" type="tel" maxlength="20" placeholder="07 00 00 00 00" value="'+esc(d?d.phone:"")+'"></label></div>'+
    '<button class="btn primary" data-a="join">'+(d?"Enregistrer":"Rejoindre l’équipe")+'</button>'+(d?' <button class="btn" data-a="cancelp">Annuler</button>':"");
    return;
  }
  const s=ST[d.status]||ST.absent;
  box.innerHTML='<h2>Ma disponibilité</h2><div class="stbig" role="group" aria-label="Mon statut">'+Object.keys(ST).map(k=>'<button class="c-'+ST[k].c+'" data-a="st" data-id="'+d.id+'" data-s="'+k+'" aria-pressed="'+(d.status===k)+'">'+ST[k].l+'</button>').join("")+'</div>'+
  '<div class="fields"><label>Précision pour l’équipe<input id="m-note" maxlength="120" placeholder="Ex. disponible jusqu’à 17 h" value="'+esc(d.note)+'"></label>'+
  '<label>De retour à<input id="m-back" type="time" value="'+esc(d.backAt)+'"></label></div>'+
  '<button class="btn primary" data-a="savenote">Enregistrer la précision</button> <button class="link" data-a="editp">Modifier mon profil</button>'+
  '<h2 style="margin-top:16px">Ma semaine</h2><div class="mplan">'+DAYS.map((x,i)=>'<div class="'+(i===TODAY?"today":"")+'">'+x+'</div>').join("")+
  (d.plan||WEEK).map((p,i)=>'<button class="cell c-'+PL[p].c+'" data-a="cy" data-id="'+d.id+'" data-d="'+i+'" aria-label="'+DAYS[i]+" : "+PL[p].l+'">'+PL[p].l+'</button>').join("")+'</div>';
}
function filtered(){
  const q=F.q.trim().toLowerCase();
  return team.filter(e=>(!q||String(e.name).toLowerCase().includes(q))&&(!F.role||e.role===F.role)&&(!F.zone||e.zone===F.zone)&&(!F.status||e.status===F.status))
    .sort((a,b)=>(a.id===uid?-1:b.id===uid?1:0)||String(a.name).localeCompare(String(b.name),"fr"));
}
function renderGrid(){
  const L=filtered();
  $("#grid").innerHTML=L.length?L.map(e=>{const s=ST[e.status]||ST.absent;const act=canAct(e);
   return '<article class="card c-'+s.c+(e.id===uid?" me":"")+'">'+
   '<div class="row"><div class="av" style="'+avs(e.name)+'">'+esc(ini(e.name))+'</div>'+
   '<div class="grow"><p class="nm">'+esc(e.name)+(e.id===uid?" (vous)":"")+'</p><p class="meta">'+esc(e.role)+", "+esc(e.zone)+(e.team?" – "+esc(e.team):"")+'</p></div>'+
   '<span class="pill">'+s.l+'</span></div>'+
   (e.note||e.backAt?'<p class="note">'+esc(e.note)+(e.note&&e.backAt?" – ":"")+(e.backAt?"de retour à "+esc(e.backAt):"")+'</p>':"")+
   (act?'<div class="seg" role="group" aria-label="Changer le statut de '+esc(e.name)+'">'+Object.keys(ST).map(k=>'<button class="c-'+ST[k].c+'" data-a="st" data-id="'+e.id+'" data-s="'+k+'" aria-pressed="'+(e.status===k)+'">'+ST[k].s+'</button>').join("")+'</div>':"")+
   '<div class="foot"><span>'+ago(e.since||0)+'</span><span>'+(e.phone?'<a href="tel:'+esc(String(e.phone).replace(/[^+\d]/g,""))+'">'+esc(e.phone)+'</a>':"")+(isOwner?' <button class="link" data-a="team" data-id="'+e.id+'">Équipe</button> <button class="link" data-a="rc" data-id="'+e.id+'">Réinit. mdp</button> <button class="link" data-a="rm" data-id="'+e.id+'">Retirer</button>':"")+'</span></div></article>'}).join(""):
   '<div class="empty">'+(team.length?"Aucun employé ne correspond aux filtres.":"Aucun employé pour l’instant. Partagez le lien avec l’équipe : chacun rejoint et indique sa disponibilité.")+'</div>';
}
function renderPlan(){
  const T=[...team].sort((a,b)=>String(a.name).localeCompare(String(b.name),"fr"));
  const head='<thead><tr><th>Employé</th>'+DAYS.map((d,i)=>'<th class="'+(i===TODAY?"today":"")+'">'+d+'</th>').join("")+'</tr></thead>';
  const body='<tbody>'+T.map(e=>'<tr><td>'+esc(e.name)+'<div class="meta">'+esc(e.role)+'</div></td>'+(e.plan||WEEK).map((p,i)=>'<td class="'+(i===TODAY?"today":"")+'">'+(canAct(e)?'<button class="cell c-'+PL[p].c+'" data-a="cy" data-id="'+e.id+'" data-d="'+i+'" aria-label="'+esc(e.name)+", "+DAYS[i]+" : "+PL[p].l+'">'+PL[p].l+'</button>':'<span class="cell c-'+PL[p].c+'">'+PL[p].l+'</span>')+'</td>').join("")+'</tr>').join("")+'</tbody>';
  const foot='<tfoot><tr><td>Effectif prévu</td>'+DAYS.map((d,i)=>'<td class="'+(i===TODAY?"today":"")+'">'+team.filter(e=>(e.plan||WEEK)[i]==="T").length+'</td>').join("")+'</tr></tfoot>';
  $("#plan").innerHTML=head+body+foot;
}
function renderTeams(){
  const NO="Sans équipe",L=filtered(),rank={dispo:0,tournee:1,pause:2,absent:3};
  const names=[...new Set(team.map(e=>e.team||NO))].sort((a,b)=>a.localeCompare(b,"fr"));
  const html=names.map(n=>{
    const all=team.filter(e=>(e.team||NO)===n);
    const shown=L.filter(e=>(e.team||NO)===n).sort((a,b)=>(rank[a.status]-rank[b.status])||String(a.name).localeCompare(String(b.name),"fr"));
    if(!shown.length)return"";
    const cnt=k=>all.filter(e=>e.status===k).length,on=cnt("dispo")+cnt("tournee"),pa=cnt("pause"),ab=cnt("absent");
    return '<article class="tcard"><header><h2>'+esc(n)+'</h2><span class="tcount">'+on+' en service sur '+all.length+'</span></header>'+
    '<div class="bar">'+Object.keys(ST).map(k=>'<i class="c-'+ST[k].c+'" style="width:'+(cnt(k)/all.length*100)+'%"></i>').join("")+'</div>'+
    '<ul class="members">'+shown.map(e=>{const s=ST[e.status]||ST.absent;return '<li class="c-'+s.c+'"><span class="dot"></span><div class="grow"><b>'+esc(e.name)+(e.id===uid?" (vous)":"")+'</b><span class="meta">'+esc(e.role)+(e.note?" – "+esc(e.note):"")+'</span></div><span class="pill">'+s.l+'</span></li>'}).join("")+'</ul>'+
    '<p class="meta">'+on+' en service, '+pa+' en pause, '+ab+' absent'+(ab>1?"s":"")+'</p></article>';
  }).join("");
  $("#teams").innerHTML=html||'<div class="empty">'+(team.length?"Aucun employé ne correspond au filtre.":"Aucune équipe pour l’instant. Les équipes apparaissent dès que des employés créent leur compte.")+'</div>';
}
function fillTeams(list){$("#teamlist").innerHTML=list.map(n=>'<option value="'+esc(n)+'">').join("")}
function render(){renderHero();renderMine();renderTeams();renderGrid();renderPlan()}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a],[data-tab]");if(!b)return;
  if(b.dataset.tab){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("#v-equipes").hidden=b.dataset.tab!=="equipes";$("#v-equipe").hidden=b.dataset.tab!=="equipe";$("#v-plan").hidden=b.dataset.tab!=="plan";return}
  const a=b.dataset.a,id=b.dataset.id;
  if(a==="kpi"){F.status=F.status===b.dataset.s?"":b.dataset.s;renderHero();renderGrid();renderTeams();return}
  if(!db)return;
  if(a==="join"){
    const name=$("#s-name").value.trim();if(!name){$("#s-name").focus();return}
    const p={name,role:$("#s-role").value,zone:$("#s-zone").value,team:$("#s-team").value.trim(),phone:$("#s-phone").value.trim()};
    const d=me();editProfile=false;
    enqueue(uid,()=>d?ref(uid).update(p):ref(uid).set({...p,status:"dispo",since:Date.now(),note:"",backAt:"",plan:WEEK}));
  }
  else if(a==="editp"){editProfile=true;renderMine(true)}
  else if(a==="cancelp"){editProfile=false;renderMine(true)}
  else if(a==="st"){const e=team.find(x=>x.id===id);if(e&&e.status!==b.dataset.s)enqueue(id,()=>ref(id).update({status:b.dataset.s,since:Date.now()}))}
  else if(a==="savenote"){const n=$("#m-note").value.trim(),t=$("#m-back").value;enqueue(uid,()=>ref(uid).update({note:n,backAt:t}))}
  else if(a==="cy"){const e=team.find(x=>x.id===id);if(!e)return;const d=+b.dataset.d,o=["T","R","C"],pl=(e.plan||WEEK).slice();pl[d]=o[(o.indexOf(pl[d])+1)%3];enqueue(id,()=>ref(id).update({plan:pl}))}
  else if(a==="rc"){const e=team.find(x=>x.id===id);if(!e)return;api("POST","/api/staff/"+id+"/reset-code").then(c=>alert("Code de réinitialisation pour "+e.name+" : "+c.code+"\n\nValable 30 minutes. Communiquez-le à l’employé : il le saisira sur l’écran « Mot de passe oublié ».")).catch(x=>{$("#err").textContent=x.message;$("#err").hidden=false})}
  else if(a==="team"){const e=team.find(x=>x.id===id);if(!e)return;const n=prompt("Équipe de "+e.name+" :",e.team||"");if(n!==null&&n.trim())enqueue(id,()=>ref(id).update({team:n.trim()}))}
  else if(a==="rm"){const e=team.find(x=>x.id===id);if(e&&confirm("Retirer "+e.name+" de l’équipe ?"))enqueue(id,()=>ref(id).delete())}
});
$("#q").addEventListener("input",e=>{F.q=e.target.value;renderGrid();renderTeams()});
$("#fr").addEventListener("change",e=>{F.role=e.target.value;renderGrid();renderTeams()});
$("#fz").addEventListener("change",e=>{F.zone=e.target.value;renderGrid();renderTeams()});
$("#fr").innerHTML=opts(ROLES,"Toutes les fonctions");
$("#fz").innerHTML=opts(ZONES,"Toutes les zones");
$("#date").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

function info(t){const i=$("#info");i.textContent=t;i.hidden=!t}
async function api(m,u,b){
  const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},credentials:"same-origin",body:b?JSON.stringify(b):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status===401&&!/\/api\/(login|register|me)$/.test(u))showAuth();
    const e=new Error((j&&j.error)||"Une erreur est survenue.");e.code=r.status===403?"invalid_argument":"error";throw e;
  }
  return j;
}
const shim={doc:p=>{const id=p.split("/")[1];return{
  set:d=>api("PATCH","/api/staff/"+id,d),update:d=>api("PATCH","/api/staff/"+id,d),delete:()=>api("DELETE","/api/staff/"+id)}}};
async function loadTeam(){team=await api("GET","/api/staff");loaded=true;fillTeams([...new Set(team.map(e=>e.team).filter(Boolean))]);render()}
let timer=null,authMode=(function(){try{return localStorage.getItem("yoplait-known")?"login":"register"}catch(e){return"login"}})();
function setAuthMode(m){authMode=m;
  document.querySelectorAll("[data-auth]").forEach(b=>b.classList.toggle("on",b.dataset.auth===m));
  document.querySelectorAll("[data-reg]").forEach(l=>l.hidden=m!=="register");
  document.querySelectorAll("[data-rst]").forEach(l=>l.hidden=m!=="reset");
  $("#a-forgot").hidden=m!=="login";
  $("#a-go").textContent={login:"Se connecter",register:"Créer mon compte",reset:"Changer mon mot de passe"}[m];
  $("#a-plabel").textContent=m==="reset"?"Nouveau mot de passe":"Mot de passe";
  $("#a-pass").autocomplete=m==="login"?"current-password":"new-password";
  $("#a-title").textContent={login:"Bon retour",register:"Bienvenue",reset:"Mot de passe oublié"}[m];
  $("#a-intro").textContent={login:"Connectez-vous avec votre numéro de téléphone.",register:"Créez votre compte pour indiquer votre disponibilité à votre équipe.",reset:"Saisissez votre numéro, le code reçu de votre administrateur, puis choisissez un nouveau mot de passe."}[m]}
function showAuth(){api("GET","/api/teams").then(fillTeams).catch(()=>{});document.body.classList.add("anon");$("#auth").hidden=false;$("#logout").hidden=true;$("#mine").hidden=true;if(timer){clearInterval(timer);timer=null}setAuthMode(authMode)}
function startApp(){document.body.classList.remove("anon");$("#auth").hidden=true;$("#logout").hidden=false;db=shim;mineSig="";
  loadTeam().catch(()=>info("La liste de l’équipe n’a pas pu être chargée. Rechargez la page."));
  if(!timer)timer=setInterval(()=>loadTeam().catch(()=>{}),10000)}
async function init(){
  try{const m=await api("GET","/api/me");try{localStorage.setItem("yoplait-known","1")}catch(e){}uid=m.id;isOwner=m.isAdmin;defName=m.name||""}catch(e){showAuth();return}
  info("");startApp();
}
document.querySelectorAll("[data-auth]").forEach(b=>b.addEventListener("click",()=>setAuthMode(b.dataset.auth)));
$("#a-forgot").addEventListener("click",()=>{$("#err").hidden=true;setAuthMode("reset")});
$("#a-back").addEventListener("click",()=>{$("#err").hidden=true;setAuthMode("login")});
$("#a-show").addEventListener("change",e=>{$("#a-pass").type=e.target.checked?"text":"password"});
$("#a-role").innerHTML=opts(ROLES);$("#a-zone").innerHTML=opts(ZONES);
$("#a-go").addEventListener("click",async()=>{
  const body={phone:$("#a-phone").value,password:$("#a-pass").value};
  if(authMode==="reset")body.code=$("#a-rcode").value.trim();
  if(authMode==="register")Object.assign(body,{name:$("#a-name").value,role:$("#a-role").value,zone:$("#a-zone").value,team:$("#a-team").value,code:$("#a-code").value});
  try{await api("POST","/api/"+authMode,body);$("#err").hidden=true;$("#a-pass").value="";try{localStorage.setItem("yoplait-known","1")}catch(e){}await init()}
  catch(e){$("#err").textContent=e.message;$("#err").hidden=false}
});
$("#logout").addEventListener("click",async()=>{try{await api("POST","/api/logout")}catch(e){}location.reload()});
setInterval(renderGrid,60000);
render();init();
</script>
</body>
</html>
