<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon catalogue WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F8F5;--card:#fff;--ink:#12261C;--mute:#5B6E62;--line:#DCE6DF;--green:#1F7A4D;--onGreen:#fff;--sun:#F2B63D;--chili:#C8402B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1B15;--card:#172A20;--ink:#EAF3ED;--mute:#9DB3A5;--line:#264034;--green:#3DB074;--onGreen:#08140D;--chili:#F0765F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;line-height:1.1}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header,.hero{padding:28px 0 18px}
header h1,.hero h1{font-size:clamp(2rem,8vw,3rem);font-weight:800;letter-spacing:-.02em}
header p,.hero p{margin:10px 0 0;color:var(--mute);max-width:46ch}
.badge{display:inline-block;background:var(--sun);color:#3a2a00;font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--onGreen)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.emo{flex:none;width:72px;height:72px;display:grid;place-items:center;font-size:2.2rem;background:var(--bg);border-radius:12px;overflow:hidden}
.emo img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1;min-width:0}
.info h3{font-size:1.05rem;font-weight:600}
.info small{color:var(--mute)}
.price{font-weight:700;margin-top:2px}
.qty{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.add,.btn{background:var(--green);color:var(--onGreen);font-weight:700;padding:10px 14px;border-radius:10px;border:0;text-decoration:none;display:inline-block}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--chili);color:#fff}
.qty .b{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:1.2rem;line-height:1}
